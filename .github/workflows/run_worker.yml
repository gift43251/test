name: 24H News Monitor Worker

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘自動執行一次
  workflow_dispatch: # 允許你在 GitHub 後台手動點擊執行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
    - name: 簽出程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        pip install feedparser requests deep_translator textblob pandas transformers torch

    - name: 執行新聞抓取與推播
      run: python worker.py

    - name: 將最新資料庫提交並回存至 GitHub
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add news_monitor_v9.db
        git commit -m "自動更新新聞資料庫: $(date)" || exit 0
        git push
